name: جمع الأخبار

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install
        run: npm install fast-xml-parser@4 --no-save

      - name: collect
        run: node collect.mjs

      - name: save
        run: |
          git config user.name  "marsad-bot"
          git config user.email "actions@github.com"
          git add docs/data/*.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "update"
            git push
          fi
